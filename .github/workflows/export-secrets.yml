# One-off: writes this repository's secrets to ~/harbor-secrets.json of the deploy user on the VM,
# readable only by that user, so they can be recovered into a password manager. Nothing reaches
# the log. Delete this file, and the file on the VM, once that is done.
name: Export secrets

on: workflow_dispatch

permissions: {}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CONFIG
          Host vm
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
          CONFIG

      - name: Write the secrets to the VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          POSTGRES_ROOT_PASSWORD: ${{ secrets.POSTGRES_ROOT_PASSWORD }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          POSTGRES_PASSWORD_BLOODLINE: ${{ secrets.POSTGRES_PASSWORD_BLOODLINE }}
          MONGO_PASSWORD_FLEXIDIM: ${{ secrets.MONGO_PASSWORD_FLEXIDIM }}
          POSTGRES_PASSWORD_ZITADEL: ${{ secrets.POSTGRES_PASSWORD_ZITADEL }}
          POSTGRES_PASSWORD_OSAGROUP: ${{ secrets.POSTGRES_PASSWORD_OSAGROUP }}
          ZITADEL_MASTERKEY: ${{ secrets.ZITADEL_MASTERKEY }}
          ZITADEL_ADMIN_PASSWORD: ${{ secrets.ZITADEL_ADMIN_PASSWORD }}
          ZITADEL_LOGIN_COOKIE_SECRET: ${{ secrets.ZITADEL_LOGIN_COOKIE_SECRET }}
          ZITADEL_TOKEN: ${{ secrets.ZITADEL_TOKEN }}
        run: |
          jq -n 'env | with_entries(select(.key | test("^(SSH_|POSTGRES_|MONGO_|ZITADEL_)")))' |
            ssh vm 'umask 077 && cat > ~/harbor-secrets.json'
          echo "Written to ~/harbor-secrets.json on the VM"
